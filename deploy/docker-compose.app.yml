# The CRM app behind HTTPS (Caddy gets and renews the certificate). Runs next to the official Supabase compose stack.
#   docker compose -f deploy/docker-compose.app.yml --env-file deploy/app.env up -d --build
services:
  app:
    build:
      context: ..
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SONIOX_API_KEY: ${SONIOX_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${CRM_DOMAIN} --to app:3100
    volumes: [caddy_data:/data]
    depends_on: [app]
volumes:
  caddy_data:
