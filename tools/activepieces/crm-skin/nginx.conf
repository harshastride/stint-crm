# "CRM skin" for Activepieces: the same Activepieces, with its logo and extra menus hidden when shown inside the CRM.
# The CRM's Automation builder page uses this address (http://localhost:8081); http://localhost:8080 stays untouched.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  location = /__stint/skin.js { alias /etc/nginx/skin.js; default_type application/javascript; add_header Cache-Control "no-cache"; }
  location = /__stint/logo.svg { alias /etc/nginx/logo.svg; default_type image/svg+xml; }
  location = /__stint/icon.svg { alias /etc/nginx/icon.svg; default_type image/svg+xml; }
  location / {
    proxy_pass http://activepieces:80;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 300s;
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '</head>' '<script src="/__stint/skin.js"></script></head>';
  }
}
